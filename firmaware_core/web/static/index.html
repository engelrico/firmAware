<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>firmAware</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>firmAware</h1></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search entries" aria-label="Search entries" autocomplete="off">
      <div class="seg" role="group" aria-label="Filter">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="outdated" aria-pressed="false">Outdated</button>
        <button type="button" data-filter="disabled" aria-pressed="false">Disabled</button>
      </div>
      <button type="button" id="add-entry" class="btn">Add entry</button>
      <button type="button" id="check-all" class="btn primary" data-check>Check all</button>
    </div>
  </header>

  <main>
    <p id="summary" class="summary" aria-live="polite"></p>
    <div id="message" class="message" role="status" hidden></div>
    <section id="checks" class="card checks" aria-labelledby="checks-title" hidden>
      <div class="checks-head">
        <strong id="checks-title">Check</strong>
        <span id="checks-status" class="muted" aria-live="polite"></span>
        <button type="button" id="checks-close" class="icon-btn" aria-label="Hide check results">&times;</button>
      </div>
      <div class="progress" aria-hidden="true"><div id="checks-bar"></div></div>
      <div id="checks-lines" class="lines mono"></div>
    </section>
    <div id="groups"></div>
  </main>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" id="panel-close" class="icon-btn" aria-label="Close details">&times;</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <dialog id="add-dialog" class="dialog" aria-labelledby="add-title">
    <form id="add-form" autocomplete="off">
      <div class="panel-head">
        <h2 id="add-title">Add entry</h2>
        <button type="button" id="add-close" class="icon-btn" aria-label="Close dialog">&times;</button>
      </div>
      <div class="dialog-body">
        <p class="muted">Pick the device type. Add the same type twice to track two devices of it.</p>
        <input id="profile-search" type="search" placeholder="Search device types" aria-label="Search device types">
        <fieldset class="profiles" id="profile-list">
          <legend class="sr-only">Device type</legend>
        </fieldset>
        <div class="field">
          <label for="add-name">Name</label>
          <input id="add-name" type="text" required placeholder="e.g. Tolino (bedroom)">
          <p class="hint">How this device is shown. Each name can be used once.</p>
        </div>
        <p id="add-error" class="form-error" role="alert" hidden></p>
      </div>
      <div class="dialog-foot">
        <button type="button" id="add-cancel" class="btn">Cancel</button>
        <button type="submit" id="add-submit" class="btn primary" disabled>Add entry</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
